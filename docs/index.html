<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toolbox</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="layout">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="nav-panel" aria-label="Open menu">
            <span class="menu-toggle-bar" aria-hidden="true"></span>
            <span class="menu-toggle-bar" aria-hidden="true"></span>
            <span class="menu-toggle-bar" aria-hidden="true"></span>
          </button>
          <a href="#/home/tools" class="brand">toolbox</a>
        </div>
        <div class="topbar-actions">
          <label class="sr-only" for="theme-select">Theme</label>
          <select id="theme-select" aria-label="Theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </header>
      <div class="layout-body">
        <aside id="nav-panel" class="sidebar" aria-label="Site navigation">
          <div class="sidebar-scroll">
            <div class="sidebar-search-row">
              <label class="sr-only" for="tool-search">Search tools</label>
              <input
                type="text"
                id="tool-search"
                class="tool-search"
                inputmode="search"
                enterkeyhint="search"
                placeholder="Search..."
                autocomplete="off"
                aria-label="Search tools"
              />
              <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>×</button>
            </div>
            <nav class="nav-home" id="nav-home" aria-label="Home">
              <a href="#/home/tools" class="nav-home-link">Home</a>
            </nav>
            <nav id="nav-tree" class="nav-tree" aria-label="Tools"></nav>
          </div>
        </aside>
        <div class="content-stage">
          <main id="main" class="main" tabindex="-1"></main>
          <aside id="right-rail" class="right-rail" aria-label="On this page">
            <div class="right-rail-scroll" id="right-rail-scroll"></div>
          </aside>
        </div>
      </div>
    </div>
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
